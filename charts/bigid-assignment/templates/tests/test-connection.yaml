apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bigid-assignment.fullname" . }}-test-connection"
  labels:
    {{- include "bigid-assignment.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['-qO-', 'http://{{ include "bigid-assignment.fullname" . }}:{{ .Values.service.port }}/health']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
