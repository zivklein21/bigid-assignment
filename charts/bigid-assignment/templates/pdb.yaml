{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bigid-assignment.fullname" . }}
  labels:
    {{- include "bigid-assignment.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bigid-assignment.selectorLabels" . | nindent 6 }}
{{- end }}
