name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format check
        run: uvx ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -v

  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ghcr.io/${{github.repository}}:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with trivy
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{github.repository}}:${{ steps.vars.outputs.sha }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint --strict charts/bigid-assignment

  deploy-staging:
    needs: [build, helm-lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - uses: azure/setup-helm@v4

      - name: Create ns and image pull secret
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n staging create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm deploy
        run: |
          helm upgrade --install whoami charts/bigid-assignment \
            --namespace staging \
            -f charts/bigid-assignment/values-staging.yaml \
            --set-string image.tag=${{ needs.build.outputs.sha }} \
            --wait --timeout 3m

      - name: Verify Deploy
        run: |
          image=$(kubectl -n staging get deploy whoami-bigid-assignment \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Deployed: $image"
          [[ "$image"  == *":${{ needs.build.outputs.sha }}" ]]

      - name: Helm test (in-cluster)
        run: helm test whoami --namespace staging --logs

      - name: Smoke test
        run: |
          kubectl -n staging port-forward svc/whoami-bigid-assignment 8080:80 > /dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -fs localhost:8080/health > /dev/null && break
            sleep 1
          done
          bash scripts/smoke-test.sh http://localhost:9999

      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n staging get pods -o wide
          kubectl -n staging describe pods
          kubectl -n staging logs -l app.kubernetes.io/instance=whoami --tail=100

  notify:
    needs: [lint, tests, helm-lint, build, deploy-staging]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Set commit status
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f context="deploy/staging" \
            -f description="Staging deploy + smoke test: $STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"